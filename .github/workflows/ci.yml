name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from the "packageManager" field in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Dependency boundaries (dependency-cruiser)
        run: pnpm depcruise

      - name: Unit tests
        run: pnpm test

      - name: Determinism double-run
        run: |
          pnpm --silent sim -- --seed 1 --max-turns 10 > /tmp/sim-run-a.json
          pnpm --silent sim -- --seed 1 --max-turns 10 > /tmp/sim-run-b.json
          diff /tmp/sim-run-a.json /tmp/sim-run-b.json
          echo "Determinism double-run: outputs identical."

      - name: Benchmarks (budget gate, doc 04 §7)
        run: pnpm bench

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: apps/game
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: apps/game
        run: npx playwright install-deps chromium

      - name: Playwright smoke test
        run: pnpm --filter @civ8/game run test:e2e

      # Runs AFTER the Playwright step: Playwright clears its outputDir
      # (apps/game/test-results/) at the start of every test:e2e run, so a
      # PNG written there earlier in the job would be silently deleted before
      # the upload-artifact step ever ran. Ordering after Playwright — rather
      # than writing outside test-results/ — keeps this artifact alongside
      # the other test-results/** artifacts in the same upload step below.
      - name: Mapgen preview PNG (artifact; byte-identical across runs)
        run: |
          mkdir -p apps/game/test-results
          pnpm mapgen -- --seed 7 --size huge --out apps/game/test-results/map-seed7-huge.png \
            | tee /tmp/mapgen-a.log
          pnpm mapgen -- --seed 7 --size huge --out /tmp/map-seed7-huge-b.png | tee /tmp/mapgen-b.log
          cmp apps/game/test-results/map-seed7-huge.png /tmp/map-seed7-huge-b.png
          echo "mapgen PNG: byte-identical across runs."

      - name: Upload Playwright screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: |
            apps/game/test-results/**
            apps/game/playwright-report/**
          if-no-files-found: warn
